<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz 30 de septiembre 💙</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="start-screen">
    <button id="start-button">Apretá aquí 💙</button>
  </div>

  <main id="app" class="hidden">
    <div class="background"></div>
    <h1>Feliz 30 de septiembre<span>❤</span>!</h1>

    <section class="bouquet" aria-label="Ramo de Hot Wheels">
      <article class="flower flower-1" data-index="0"><div class="flower-head"><i></i><i></i><i></i><i></i><b></b></div><div class="stem"></div><div class="leaf leaf-left"></div><div class="leaf leaf-right"></div></article>
      <article class="flower flower-2" data-index="1"><div class="flower-head"><i></i><i></i><i></i><i></i><b></b></div><div class="stem"></div><div class="leaf leaf-left"></div><div class="leaf leaf-right"></div></article>
      <article class="flower flower-3" data-index="2"><div class="flower-head"><i></i><i></i><i></i><i></i><b></b></div><div class="stem"></div><div class="leaf leaf-left"></div><div class="leaf leaf-right"></div></article>
      <article class="flower flower-4" data-index="3"><div class="flower-head"><i></i><i></i><i></i><i></i><b></b></div><div class="stem"></div><div class="leaf leaf-left"></div><div class="leaf leaf-right"></div></article>
      <article class="flower flower-5" data-index="4"><div class="flower-head"><i></i><i></i><i></i><i></i><b></b></div><div class="stem"></div><div class="leaf leaf-left"></div><div class="leaf leaf-right"></div></article>
      <div class="grass grass-left"></div><div class="grass grass-right"></div>
    </section>
    <div id="particles"></div>
  </main>

  <section id="modal" class="modal" aria-hidden="true">
    <button id="close-modal" class="close" aria-label="Cerrar">×</button>
    <div class="modal-content">
      <h2>Feliz 30 de septiembre<span>❤</span>!</h2>
      <img id="modal-image" src="" alt="Tarjeta Hot Wheels">
      <p id="modal-message"></p>
    </div>
  </section>

  <audio id="music" loop preload="auto">
    <source src="https://github.com/Baque2005/public-files/raw/refs/heads/main/2025/new%20west%20-%20those%20eyes%20%20sub.%20espa%C3%B1ol.mp3" type="audio/mpeg">
  </audio>
  <script src="script.js"></script>
</body>
</html>
