<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Sergio 🏎️❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 id="main-title" class="title">Tengo algo que darte...</h1>
        <button id="openBtn" class="btn">Abrir regalo ❤️</button>

        <div id="bouquet" class="hidden">
            <h2 class="glow-text">💐 TU RAMO DE HOT WHEELS 🏎️</h2>
            <p class="subtitle">Toca los carritos...</p>
            
            <div class="cars-container">
                <!-- Carrito 1 -->
                <div class="car-card" onclick="flipCard(this)">
                    <div class="car-inner">
                        <div class="car-front">🏎️</div>
                        <div class="car-back">Eres<br>increíble</div>
                    </div>
                </div>
                <!-- Carrito 2 -->
                <div class="car-card" onclick="flipCard(this)">
                    <div class="car-inner">
                        <div class="car-front">🚘</div>
                        <div class="car-back">Me haces<br>muy feliz</div>
                    </div>
                </div>
                <!-- Carrito 3 -->
                <div class="car-card" onclick="flipCard(this)">
                    <div class="car-inner">
                        <div class="car-front">🚗</div>
                        <div class="car-back">Mi<br>favorito</div>
                    </div>
                </div>
                <!-- Carrito 4 -->
                <div class="car-card" onclick="flipCard(this)">
                    <div class="car-inner">
                        <div class="car-front">🏁</div>
                        <div class="car-back">Te quiero<br>muchísimo</div>
                    </div>
                </div>
            </div>

            <p class="final-message">Vos me regalaste flores amarillas... así que ahora te tocaba recibir un ramo también, pero uno que fuera más vos. 🏎️❤️</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
